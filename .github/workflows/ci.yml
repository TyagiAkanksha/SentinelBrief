name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

env:
  UV_LOCKED: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinelbrief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinelbrief_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: ruff check
        run: uv run ruff check --no-cache .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: import-linter
        run: uv run lint-imports

      - name: pytest with coverage
        run: uv run pytest -q --cov=api --cov=worker --cov=core --cov=evals --cov-fail-under=90

      - name: pip-audit
        continue-on-error: true
        shell: bash
        run: uv export --format requirements-txt --no-emit-project | uvx pip-audit -r /dev/stdin

name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

env:
  UV_LOCKED: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinelbrief_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinelbrief_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: ruff check
        run: uv run ruff check --no-cache .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: import-linter
        run: uv run lint-imports

      - name: OpenAPI baseline drift (CONVENTIONS §8)
        run: uv run python scripts/export_openapi.py --out /tmp/openapi.json && cmp /tmp/openapi.json api/openapi.json

      - name: pytest with coverage (no skips allowed)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rs --cov=api --cov=worker --cov=core --cov=evals --cov-fail-under=90 2>&1 | tee pytest.log
          # The DB suite skips silently when TEST_DATABASE_URL is unset (CONVENTIONS §10); a green run
          # with skips proves nothing, so any skip fails CI (M2 task-01 review M7).
          if grep -qE '(^SKIPPED|[0-9]+ skipped)' pytest.log; then echo '::error::tests were skipped'; exit 1; fi

      # PRD §12 M2: the image must build and the compose file must validate; docker is present on
      # ubuntu-latest so tests/test_compose_config.py never skips here (the skip is for
      # docker-less dev machines).
      - name: docker image builds; compose config validates
        shell: bash
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config > /dev/null
          docker compose -f infra/docker-compose.yml build api

      - name: pip-audit
        continue-on-error: true
        shell: bash
        run: uv export --format requirements-txt --no-emit-project | uvx pip-audit -r /dev/stdin

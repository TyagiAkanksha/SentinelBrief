name: nightly-eval

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      prompt_version:
        description: "Prompt version to replay against evals/golden/v2.jsonl (blank = pinned default)"
        required: false
        default: ""
        type: string

env:
  UV_LOCKED: "1"

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.openai.com/v1
      CHEAP_MODEL: gpt-4o-mini
      STRONG_MODEL: gpt-5.4
      MODEL_PRICES_JSON: '{"gpt-4o-mini":{"input_per_mtok":"0.15","output_per_mtok":"0.60"},"gpt-5.4":{"input_per_mtok":"2.50","output_per_mtok":"15.00"}}'
      TRIAGE_PROMPT_VERSION: triage-v4
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: nightly gate — strict-replay v2 golden set
        # The judge is back on (m8b task-05 reverts M7's --no-judge): the production triage path
        # (worker/triage.py) now has a daily token-budget circuit breaker (DAILY_TOKEN_BUDGET,
        # worker/budget.py) capping LLM spend, so skipping the strong-model judge here is no
        # longer this project's only cost guard against an unbounded nightly LLM bill.
        env:
          PROMPT_VERSION_INPUT: ${{ inputs.prompt_version }}
        run: |
          TRIAGE_PROMPT_VERSION="${PROMPT_VERSION_INPUT:-$TRIAGE_PROMPT_VERSION}"
          uv run python -m evals.run --golden evals/golden/v2.jsonl --prompt "$TRIAGE_PROMPT_VERSION" --strong-model "$STRONG_MODEL" --gate --output-dir evals/results --tool-fixtures evals/golden/fixtures

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/*.json

# SentinelBrief Alembic config (CONVENTIONS.md §6). The database URL is intentionally left
# empty here: `alembic/env.py` resolves it at runtime — this file's own `sqlalchemy.url` first
# (the test fixtures pin it explicitly via `Config.set_main_option`), then `DATABASE_URL`, then
# `TEST_DATABASE_URL`.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

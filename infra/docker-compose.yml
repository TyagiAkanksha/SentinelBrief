# infra/docker-compose.yml — SentinelBrief local orchestration (PRD §11; CONVENTIONS.md §11).
#
# Five services: postgres, api, web, redis, worker (from M5).
#
# Migrations are never run at container startup (CONVENTIONS.md §11) — run them explicitly:
#   docker compose -f infra/docker-compose.yml run --rm api uv run alembic upgrade head
#
# All services publish ports on 127.0.0.1 only (`.claude/rules/infra.md`) and use json-file log
# rotation from day one (docs/deployment.md). `worker` shares the `api` image (same build
# context/Dockerfile) with a different `command:` and never publishes a port — only ARQ jobs
# reach it, through Redis.

name: sentinelbrief

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    environment:
      # Dev-only values matching .env.example's DATABASE_URL — never used against a deployed
      # database.
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelbrief
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sentinelbrief_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelbrief"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: sentinelbrief-api
    env_file: ../.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../infra/geoip:/app/infra/geoip:ro     # GeoLite2 .mmdb files fetched by scripts/fetch_geoip.py; same relative path as on the host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]   # RDB snapshot <= 60 s after a change: queued jobs survive a restart
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - sentinelbrief_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: sentinelbrief-api
    command: ["arq", "worker.main.WorkerSettings"]
    env_file: ../.env
    volumes:
      - ../infra/geoip:/app/infra/geoip:ro     # M4 task-03 M6: the worker is where get_ip_geo_asn runs now
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000     # the browser-visible API origin for local dev (SSE hook, M8)
        API_URL: http://api:8000
    image: sentinelbrief-web
    environment:
      API_URL: http://api:8000                          # server-side origin over the compose network (FRONTEND-CONVENTIONS §6)
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  sentinelbrief_pg:
  sentinelbrief_redis:

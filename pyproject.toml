[project]
name = "sentinelbrief"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "openai>=2",
    "httpx",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3",
    "alembic",
    "fastapi>=0.121",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "maxminddb>=3",
    "arq>=0.26,<1",
    "redis>=5,<6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "mypy",
    "import-linter",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "worker", "core", "evals"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.isort]
known-first-party = ["api", "worker", "core", "evals"]

[tool.mypy]
strict = true
files = ["api", "worker", "core", "evals", "alembic", "honeypot/shipper/sentinelbrief_shipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["honeypot/shipper"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls a real external API; excluded from CI and the default run"]
addopts = "-m 'not live'"
timeout = 120

[tool.coverage.run]
concurrency = ["greenlet", "thread"]

[tool.importlinter]
root_packages = ["api", "worker", "core", "evals"]

[[tool.importlinter.contracts]]
name = "core.models is a pure leaf"
type = "forbidden"
source_modules = ["core.models"]
forbidden_modules = [
    "api",
    "worker",
    "evals",
    "core.cache",
    "core.config",
    "core.db",
    "core.errors",
    "core.llm",
    "core.schemas",
    "core.services",
    "core.signing",
]

[[tool.importlinter.contracts]]
name = "core never imports api, worker or evals"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["api", "worker", "evals"]

[[tool.importlinter.contracts]]
name = "api never imports worker, evals or core.llm"
type = "forbidden"
source_modules = ["api"]
forbidden_modules = ["worker", "evals", "core.llm"]

[[tool.importlinter.contracts]]
name = "worker and evals never import api"
type = "forbidden"
source_modules = ["worker", "evals"]
forbidden_modules = ["api"]

[[tool.importlinter.contracts]]
name = "nothing imports api.main or worker.main"
type = "forbidden"
source_modules = ["api", "worker", "core", "evals"]
forbidden_modules = ["api.main", "worker.main"]

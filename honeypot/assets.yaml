# honeypot/assets.yaml — the static fleet description `get_asset_info` (PRD §6.3) reads
# once at construction: one entry per honeypot sensor hostname naming its role, network
# exposure, and criticality. Holds roles and criticality only — never credentials or
# internal addresses beyond what the honeypot already exposes (.claude/rules/infra.md).
# `hp-use-01` is the deployed honeypot (M6 task-01, honeypot/docker-compose.yml +
# honeypot/etc/cowrie.cfg); every other entry is synthetic — used by `fixtures/alerts/` and
# `evals/golden/`.


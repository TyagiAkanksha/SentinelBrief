# honeypot/etc/cowrie.cfg — only the keys that differ from cowrie.cfg.dist. Bind-mounted
# read-only (honeypot/docker-compose.yml) so a fully-compromised Cowrie process cannot rewrite
# its own sensor name or disable JSON logging (PRD §10.4: assume this host is compromised).

[honeypot]
# the deployed sensor; matches honeypot/assets.yaml and the alert's `sensor`
sensor_name = hp-use-01
# the fake hostname attackers see (Cowrie default kept)
hostname = svr04

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
